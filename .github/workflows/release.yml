name: Signed release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match app version, e.g. v0.1.0)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release identity and version
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          TAG: ${{ inputs.tag }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure private release signing secrets first'; exit 1; }
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$TAG" = "v$VERSION" || { echo 'Tag must match versionName'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Check and sign
        env:
          SPACES_KEYSTORE: ${{ runner.temp }}/release.jks
          SPACES_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SPACES_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPACES_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 scripts/ci-build.py testReleaseUnitTest lintRelease assembleRelease
      - name: Publish APK with checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk spaces-mobile.apk
          sha256sum spaces-mobile.apk > SHA256SUMS.txt
          gh release create "$TAG" spaces-mobile.apk SHA256SUMS.txt --target "$GITHUB_SHA" --title "spaces : mobile $TAG" --notes-file docs/RELEASE-NOTES.md
      - name: Remove private signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
