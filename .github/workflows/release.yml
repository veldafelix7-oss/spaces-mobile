name: Signed release APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (must match app version, e.g. v0.1.2)'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require full Android checks for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$TAG" = "v$VERSION" || { echo 'Tag must match versionName'; exit 1; }
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push" --jq '.workflow_runs | length')
          test "$COUNT" -gt 0 || { echo 'Full push-triggered build, identity, emulator and installation checks must pass first'; exit 1; }
      - name: Restore same pinned identity used by previews
        env:
          SPACES_PREVIEW_SIGNING_BUNDLE: ${{ secrets.SPACES_PREVIEW_SIGNING_BUNDLE }}
        run: python3 scripts/restore-preview-key.py
      - name: Check and sign
        run: python3 scripts/ci-build.py testReleaseUnitTest lintRelease assembleRelease
      - name: Verify pinned package, certificate and installation mode
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: bash scripts/check-preview-signing.sh
      - name: Prepare draft APK with checksum (manual publication)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk spaces-mobile.apk
          sha256sum spaces-mobile.apk > SHA256SUMS.txt
          gh release create "$TAG" spaces-mobile.apk SHA256SUMS.txt --target "$GITHUB_SHA" --draft --title "spaces : mobile $TAG" --notes-file docs/RELEASE-NOTES.md
      - name: Remove restored private key
        if: always()
        run: rm -f "$RUNNER_TEMP/spaces-private-signing/preview.p12"
