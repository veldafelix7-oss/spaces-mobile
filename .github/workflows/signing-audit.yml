name: Audit existing APK update identity
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Run containing the compiled spaces-mobile-preview artifact (does not build or publish)'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: spaces-mobile-preview
          path: app/build/outputs/apk/debug
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Compare compiled artifact with installed-version baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-preview-signing.sh
