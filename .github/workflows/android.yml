name: Android checks & preview APK
on:
  push:
    branches: ['arena/7c652660-spaces-mobile']
  pull_request:
  workflow_dispatch:
    inputs:
      audit_build_run_id:
        description: 'Optional: audit an existing APK artifact only; no new build or publication'
        required: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: ${{ !inputs.audit_build_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test signing, reset, preservation and fail-closed guards
        run: |
          python3 scripts/test-emulator-gate.py
          python3 scripts/test-preview-signing.py
          python3 scripts/test-preview-update.py
          python3 scripts/test-restore-preview-key.py
          python3 scripts/test-update-probe.py
      - name: Compile and check source without signing credentials
        run: python3 scripts/ci-build.py testDebugUnitTest lintDebug compileDebugAndroidTestJavaWithJavac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
  build:
    needs: source
    if: ${{ !inputs.audit_build_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore pinned key from private backup secret (no fallback)
        env:
          SPACES_PREVIEW_SIGNING_BUNDLE: ${{ secrets.SPACES_PREVIEW_SIGNING_BUNDLE }}
        run: python3 scripts/restore-preview-key.py
      - name: Compile, unit tests, lint and instrumentation APK
        run: python3 scripts/ci-build.py testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Compile same-key higher-version probe (not for publication)
        run: bash scripts/build-update-probe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: update-probe
          path: app/build/outputs/update-probe/app-update-probe.apk
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spaces-mobile-preview
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/*.apk
      - name: Remove restored private key
        if: always()
        run: rm -f "$RUNNER_TEMP/spaces-private-signing/preview.p12"
  audit:
    if: ${{ inputs.audit_build_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: spaces-mobile-preview
          path: app/build/outputs/apk/debug
          run-id: ${{ inputs.audit_build_run_id }}
          github-token: ${{ github.token }}
      - name: Audit existing compiled APK (no build or publication)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-preview-signing.sh

  identity:
    needs: build
    outputs:
      mode: ${{ steps.verify.outputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: spaces-mobile-preview
          path: app/build/outputs/apk/debug
      - name: Verify pinned identity and exact approved installation mode
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-preview-signing.sh

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: apks
      - name: Download previous preview for side-by-side preservation test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download preview-0.1.0-b7891f8 --pattern spaces-mobile-preview.apk --dir previous
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            echo "::notice title=Emulator stage::Boot completed; checking isolated installation"
            mkdir -p emulator-results
            adb install previous/spaces-mobile-preview.apk
            adb shell am start -W -n id.veldafelix.spaces.preview/id.veldafelix.spaces.MainActivity
            adb shell am force-stop id.veldafelix.spaces.preview
            adb shell run-as id.veldafelix.spaces.preview mkdir -p files
            adb shell "run-as id.veldafelix.spaces.preview sh -c 'echo retained > files/update-check.txt'"
            adb install apks/debug/app-debug.apk
            adb shell run-as id.veldafelix.spaces.preview cat files/update-check.txt | tee emulator-results/update-data.txt
            grep -qx retained emulator-results/update-data.txt
            adb shell pm path id.veldafelix.spaces.preview | grep -q package:
            adb shell pm path id.veldafelix.spaces.preview2 | grep -q package:
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            echo "::notice title=Emulator stage::Installation preserved old data; running instrumentation"
            bash scripts/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emulator-results/

  upgrade:
    needs: [build, identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: apks
      - uses: actions/download-artifact@v4
        with:
          name: update-probe
          path: probe
      - name: Download installed-version baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASELINE=$(python3 scripts/preview-policy.py config/preview-identity.json)
          gh release download "$BASELINE" --pattern spaces-mobile-preview.apk --dir baseline
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/check-preview-update.sh
        env:
          INSTALL_MODE: ${{ needs.identity.outputs.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-results
          path: emulator-results/

  preview:
    if: github.event_name == 'push'
    needs: [source, build, emulator, identity, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: spaces-mobile-preview
          path: preview
      - name: Prepare draft preview (manual validation before publication)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          TAG="preview-${VERSION}-${GITHUB_SHA:0:7}"
          cp preview/app-debug.apk spaces-mobile-preview.apk
          sha256sum spaces-mobile-preview.apk > SHA256SUMS.txt
          gh release create "$TAG" spaces-mobile-preview.apk SHA256SUMS.txt --target "$GITHUB_SHA" --draft --prerelease --title "spaces : mobile · Android 13 preview" --notes-file docs/RELEASE-NOTES.md
