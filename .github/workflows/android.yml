name: Android checks & preview APK
on:
  push:
    branches: ['arena/7c652660-spaces-mobile']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable preview signing identity
        env:
          PREVIEW_KEYSTORE: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PREVIEW_KEYSTORE" ]; then
            mkdir -p ~/.android
            printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          fi
      - name: Compile, unit tests, lint and instrumentation APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spaces-mobile-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: instrumentation-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            mkdir -p emulator-results
            adb shell am instrument -w id.veldafelix.spaces.preview.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-results/instrumentation.txt
            adb pull /sdcard/Android/data/id.veldafelix.spaces.preview/files/screenshots emulator-results/ || true
            adb logcat -d -s AndroidRuntime > emulator-results/crashes.txt
            grep -q 'OK (7 tests)' emulator-results/instrumentation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results
          path: emulator-results/
