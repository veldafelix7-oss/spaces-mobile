plugins { id 'com.android.application' }
// CI-only higher-version replacement probe; never a publication artifact.
def appVersionCode = 3
def updateProbe = project.findProperty('spacesUpdateProbe') == 'true'
android {
    namespace 'id.veldafelix.spaces'
    compileSdk 35
    defaultConfig {
        applicationId 'id.veldafelix.spaces.preview2'
        minSdk 33
        targetSdk 34
        versionCode (appVersionCode + (updateProbe ? 1 : 0))
        versionName '0.1.2'
        resValue 'string', 'app_name', 'spaces : mobile'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { aidl true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        preview {
            if (System.getenv('SPACES_PREVIEW_KEYSTORE')) {
                storeFile file(System.getenv('SPACES_PREVIEW_KEYSTORE'))
                storePassword System.getenv('SPACES_PREVIEW_STORE_PASSWORD')
                keyAlias System.getenv('SPACES_PREVIEW_KEY_ALIAS')
                keyPassword System.getenv('SPACES_PREVIEW_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'spaces : mobile · 0.1.2'
            // Missing credentials produce unsigned output, never a fresh random identity.
            signingConfig = System.getenv('SPACES_PREVIEW_KEYSTORE') ? signingConfigs.preview : null
        }
        release {
            minifyEnabled false
            signingConfig = System.getenv('SPACES_PREVIEW_KEYSTORE') ? signingConfigs.preview : null
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
